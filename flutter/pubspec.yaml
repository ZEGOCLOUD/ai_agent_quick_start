name: ai_agent_quickstart_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  zego_express_engine:
    path: 3rdparty/zego_express_engine

  permission_handler: ^11.3.0
  cupertino_icons: ^1.0.2
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/  # 中文字体资源目录，放置自定义字体文件
  fonts:
    - family: NotoSansSC  # 全局中文字体，优先用于Web防止乱码
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf  # NotoSansSC Regular 字体文件（.ttf 格式）