plugins {
    id "com.android.application"
}

android {
    namespace "com.zego.agentaction.demo"
    compileSdk 35

    defaultConfig {
        applicationId "com.zego.agentaction.demo"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    sourceSets {
        main.java.srcDirs += "../../agentaction/src/main/java"
    }
}

dependencies {
    implementation "com.google.protobuf:protobuf-java:4.35.0"
    implementation "im.zego:express-video:3.15.0"
}
